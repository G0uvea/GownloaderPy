name: Build and Release GownloaderPy

on:
  push:
    tags:
      - 'v*'

jobs:
  # -------------------------------------------------------------------
  # 1. JOB WINDOWS: Cria .exe portátil + FFmpeg
  # -------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 yt-dlp pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "GownloaderPy" --icon "icone.ico" --add-data "src/screen/style.qss;src/screen" --add-data "icone.ico;." src/main.py

      - name: Baixar e Extrair FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Copy-Item "ffmpeg_temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "dist/GownloaderPy/"

      - name: Empacotar ZIP para Windows
        run: |
          Compress-Archive -Path "dist/GownloaderPy/*" -DestinationPath "GownloaderPy-Windows-Portable.zip"

      - name: Upload do Artefato (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: GownloaderPy-Windows-Portable.zip

  # -------------------------------------------------------------------
  # 2. JOB LINUX: Compila o AppImage
  # -------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Sistema e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y wget binutils fuse libgl1 libglx-mesa0
          python -m pip install --upgrade pip
          pip install PyQt6 yt-dlp pyinstaller

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "GownloaderPy" --icon "icone.ico" --add-data "src/screen/style.qss:src/screen" --add-data "icone.ico:." src/main.py

      - name: Montar Estrutura AppDir e Gerar AppImage
        run: |
          mkdir -p GownloaderPy.AppDir/usr/bin
          mkdir -p GownloaderPy.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/GownloaderPy/* GownloaderPy.AppDir/usr/bin/
          cp icone.ico GownloaderPy.AppDir/GownloaderPy.png
          cp icone.ico GownloaderPy.AppDir/usr/share/icons/hicolor/256x256/apps/GownloaderPy.png

          # AppRun
          cat << 'EOF' > GownloaderPy.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/GownloaderPy" "$@"
          EOF
          chmod +x GownloaderPy.AppDir/AppRun

          # Desktop file
          cat << 'EOF' > GownloaderPy.AppDir/GownloaderPy.desktop
          [Desktop Entry]
          Type=Application
          Name=GownloaderPy
          Comment=Download e conversão de vídeos e áudios
          Exec=GownloaderPy
          Icon=GownloaderPy
          Categories=AudioVideo;Utility;
          Terminal=false
          EOF

          # Baixar e rodar AppImageTool
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage GownloaderPy.AppDir GownloaderPy-x86_64.AppImage

      - name: Upload do Artefato (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: GownloaderPy-x86_64.AppImage

  # -------------------------------------------------------------------
  # 3. RELEASE JOB: Publica os dois binários na aba Releases do GitHub
  # -------------------------------------------------------------------
  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Binário do Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - name: Baixar Binário do Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: Criar GitHub Release e Anexar Binários
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GownloaderPy-Windows-Portable.zip
            GownloaderPy-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}